<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Whimsy Merger</title>

    <link rel="stylesheet" href="base.css">

</head>

<body>

    <header class="app-header">

        <nav class="app-navigation">
            <b>
                Whimsy Merger
            </b>
        </nav>

    </header>



    <!-- ================================ -->
    <!-- Main Container -->
    <!-- ================================ -->

    <main class="app-main app-main-with-header">

        <h1>
            Whimsy Merger
        </h1>

        <p>
            Throw the Files and get a single HTML!
        </p>

        <!-- ================================ -->
        <!-- Split Layout -->
        <!-- ================================ -->
        <div class="layout-30-70">

            <section class="layout-default">
                <!-- ================================ -->
                <!-- Left Layout -->
                <!-- ================================ -->
                 Upload your files here:
                <input class="primary" type="file" id="file-picker" accept=".html,.css,.js,.zip" multiple>
                Or Choose a folder:
                <input class="primary" type="file" id="folder-picker" webkitdirectory multiple>
                <button class="button button-primary button-medium" id="merge-button">
                    Merge
                </button>

            </section>
            <section class="layout-default card-main">
                <!-- ================================ -->
                <!-- Right Layout -->
                <!-- ================================ -->

                <!-- ================================ -->
                <!-- Conflicts Error -->
                <!-- ================================ -->
                <div class="notice-error card-content" id="conflict-error" style="display: none;">
                    <h5>Potential JavaScript Conflicts</h5>
                    <p>
                        These global variables are declared in multiple files:
                    </p>

                    <ul id="conflict-file-list"></ul>

                </div>

                <!-- ================================ -->
                <!-- File List -->
                <!-- ================================ -->
                <div class="card-sub card-content">
                    <h5>Files to merge</h5>

                    <ul id="merge-file-list"></ul>


                    <h5>Ignored files</h5>

                    <ul id="ignored-file-list"></ul>
                </div>

            </section>

        </div>
    </main>


    <!-- ================================ -->
    <!-- Whimsy -->
    <!-- ================================ -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/acorn@8/dist/acorn.js"></script>

    <script src="base.js"></script>
    <script src="script.js"></script>

</body>

</html>
