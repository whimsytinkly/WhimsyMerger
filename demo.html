<body>


    
<header class="app-header">

    <nav class="app-navigation">
 <b>

        <a href="demo.html">

    <!-- ================================ -->

    <main class="app-main app-main-with-header">

                <h1>
            Whimsy Demo
        </h1>

        <p>
            This page showcases the components included in WhimsyWorkshop.
        </p>


        <section>

            <h2>
                Buttons
            </h2>

            <button class="button button-primary button-medium">
                Primary
            </button>

            <button class="button button-secondary button-medium">
                Secondary
            </button>

            <button class="button button-danger button-medium">
                Danger
            </button>

        </section>
                <section>

            <h2>
                Inputs
            </h2>

            <div class="global-fields">

                <div class="global-field">

                    <label for="demo-text">
                        Text
                    </label>

                    <input
                        id="demo-text"
                        type="text"
                        placeholder="Type something..."
                    >

                </div>

                <div class="global-field">

                    <label for="demo-select">
                        Select
                    </label>

                    <select id="demo-select">

                        <option>
                            Option one
                        </option>

                        <option>
                            Option two
                        </option>

                    </select>

                </div>

            </div>

        </section>

    </main>
